<style>

    L.tg.addEventListener("click",function(){toggle(L)});
    L.sn.addEventListener("click",function(){openPicker(L)});
    drag(el.querySelector(".knob"),function(dy){var v=Math.max(0,Math.min(100,L.s0-dy*0.6));S.l[i].ct=Math.round(v);render(L);applyGain(L)},function(){L.s0=S.l[i].ct},save);
    var tr=el.querySelector(".track");
    function setP(e){var r=tr.getBoundingClientRect();var f=(e.clientY-r.top-12)/(r.height-24);f=Math.max(0,Math.min(1,f));
      var p=Math.round((0.5-f)*24);if(Math.abs(p)<1)p=0;S.l[i].pitch=p;render(L);applyPitch(L)}
    tr.addEventListener("pointerdown",function(e){tr.setPointerCapture(e.pointerId);setP(e);tr._d=true});
    tr.addEventListener("pointermove",function(e){if(tr._d)setP(e)});
    tr.addEventListener("pointerup",function(){tr._d=false;save()});tr.addEventListener("pointercancel",function(){tr._d=false});
    tr.addEventListener("dblclick",function(){S.l[i].pitch=0;render(L);applyPitch(L);save()});
    layers.push(L);render(L);
  });
}
function drag(el,mv,st,en){var y0=0,d=false;
  el.addEventListener("pointerdown",function(e){el.setPointerCapture(e.pointerId);d=true;y0=e.clientY;st()});
  el.addEventListener("pointermove",function(e){if(d)mv(e.clientY-y0)});
  el.addEventListener("pointerup",function(){d=false;en()});el.addEventListener("pointercancel",function(){d=false});}
function setTone(n){S.tone=(n+12)%12;layers.forEach(function(L){applyPitch(L);render(L)});save()}
/* ---------- trocar som ---------- */
var pvSrc=null;
function stopPv(){if(pvSrc){try{pvSrc.stop()}catch(e){}pvSrc=null}}
function openPicker(L){
  var list=$("list");list.innerHTML="";$("mt").textContent="Som da camada "+(L.i+1)+" · "+LAYERS[L.i];
  sounds.forEach(function(m){
    var r=document.createElement("div");r.className="row"+(S.l[L.i].snd===m.id?" sel":"");
    r.innerHTML='<div class="t">'+m.label+'<small>'+m.dur+' s · '+Math.round(m.sr/100)/10+' kHz · '+m.ch+'ch · nota '+m.root+'</small></div><button class="pv">Ouvir</button><button class="use">Usar</button>';
    r.querySelector(".pv").addEventListener("click",function(e){var b=e.currentTarget;
      if(pvSrc){stopPv();b.textContent="Ouvir";return}
      b.textContent="...";getBuf(m.id).then(function(buf){stopPv();var s=ctx.createBufferSource();s.buffer=buf;var g=ctx.createGain();g.gain.value=Math.min(m.gain,3)*0.6;s.connect(g);g.connect(master);s.start();pvSrc=s;b.textContent="Parar";
        s.onended=function(){if(pvSrc===s){pvSrc=null;b.textContent="Ouvir"}}}).catch(function(){b.textContent="Ouvir"})});
    r.querySelector(".use").addEventListener("click",function(){
      stopPv();S.l[L.i].snd=m.id;save();var was=L.on;render(L);$("modal").classList.remove("show");
      if(was){L.on=false;killSrc(L,0.4);startLayer(L)}});
    list.appendChild(r)});
  $("modal").classList.add("show");
}
$("mx").addEventListener("click",function(){stopPv();$("modal").classList.remove("show")});
/* ---------- partida ---------- */
function wake(){try{if(navigator.wakeLock){navigator.wakeLock.request("screen").catch(function(){})}}catch(e){}}
document.addEventListener("visibilitychange",function(){if(!document.hidden){wake();if(ctx&&ctx.state!=="running")ctx.resume()}});
$("dn").addEventListener("click",function(){setTone(S.tone-1)});
$("up").addEventListener("click",function(){setTone(S.tone+1)});
$("mv").addEventListener("input",function(e){S.mv=+e.target.value;if(master)setMaster()});
$("mv").addEventListener("change",save);
$("stop").addEventListener("click",function(){layers.forEach(function(L){if(L.on)stopLayer(L)})});
$("reset").addEventListener("click",function(){S.l.forEach(function(x){x.pitch=0});layers.forEach(function(L){applyPitch(L);render(L)});save();toast("Altura de todas as camadas zerada")});
$("go").addEventListener("click",function(){
  if(started)return;started=true;$("go").disabled=true;$("go").textContent="Carregando...";
  initAudio();ctx.resume();wake();
  var need=[];S.l.forEach(function(x){if(need.indexOf(x.snd)<0)need.push(x.snd)});
  var done=0;Promise.all(need.map(function(id){return getBuf(id).then(function(){done++;$("prog").firstChild.style.width=(done/need.length*100)+"%"})}))
   .then(function(){$("start").style.display="none"})
   .catch(function(e){started=false;$("go").disabled=false;$("go").textContent="Tentar de novo";$("msg").textContent="Não consegui carregar os sons ("+e.message+"). Confira a internet e tente de novo."});
});
fetch("sounds.json").then(function(r){return r.json()}).then(function(j){
  sounds=j;j.forEach(function(m){byId[m.id]=m});load();
  S.l.forEach(function(x){if(!byId[x.snd])x.snd=DEFAULTS[S.l.indexOf(x)]});
  S.tone=S.tone||0;$("mv").value=S.mv;build();
  $("go").disabled=false;
}).catch(function(e){$("msg").textContent="Não consegui abrir a lista de sons: "+e.message});
$("go").disabled=true;
try{if("serviceWorker" in navigator&&location.protocol.indexOf("http")===0)navigator.serviceWorker.register("sw.js").catch(function(){})}catch(e){}
window.__pads={get ctx(){return ctx},layers:function(){return layers},S:function(){return S},toggle:function(i){toggle(layers[i])},setTone:setTone};
</script>
</body>
</html>
