<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Pads ao Vivo</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Pads">
<meta name="theme-color" content="#030c24">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<style>
:root{--bg:#0c0c0e;--panel:#1d1d20;--panel2:#2c2c2f;--ink:#f5f5f7;--mute:#8e8e93;--on:#d1d1d6;--acc:#d1d1d6;--warn:#ff453a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:-apple-system,"SF Pro Display",system-ui,"Segoe UI",Roboto,sans-serif;overflow:hidden;touch-action:manipulation}
#app{height:100%;display:flex;flex-direction:column;padding:max(8px,env(safe-area-inset-top)) max(10px,env(safe-area-inset-right)) max(8px,env(safe-area-inset-bottom)) max(10px,env(safe-area-inset-left));gap:8px}
#start{position:fixed;inset:0;z-index:50;background:#030a1c;display:flex;align-items:center;justify-content:center;overflow:hidden}
#start .art{position:relative;width:min(100vw,calc(100vh*2.1617));aspect-ratio:1844/853;background:url(start.jpg) center/100% 100% no-repeat}
#start #go{position:absolute;left:33.7%;top:67.8%;width:32.5%;height:14.5%;border:0;border-radius:999px;background:transparent;color:transparent;font-size:0;padding:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
#start #go:active{background:rgba(255,255,255,.12)}
#start #go:disabled{cursor:default}
#start #prog{position:absolute;left:35%;width:30%;top:86.6%;height:4px;background:rgba(120,180,255,.18);border-radius:4px;overflow:hidden}
#start #prog i{display:block;height:100%;width:0;background:#38b6ff;box-shadow:0 0 8px #38b6ff;transition:width .2s}
#start #msg{position:absolute;left:8%;right:8%;top:90.5%;margin:0;text-align:center;color:#ffb4b4;font-size:clamp(10px,2.6vh,14px);line-height:1.25}
#start #msg:empty{display:none}
header{display:flex;align-items:center;gap:10px;flex:0 0 auto}
.tone{display:flex;align-items:center;gap:8px;background:var(--panel);border-radius:14px;padding:6px 8px}
.tone button{width:52px;height:46px;border-radius:10px;border:0;background:var(--panel2);color:var(--ink);font-size:24px}
.tone button:active{background:var(--acc)}
.tone .n{min-width:92px;text-align:center}.tone .n small{display:block;color:var(--mute);font-size:10px;letter-spacing:.12em}.tone .n b{font-size:28px}
.vol{flex:1;display:flex;flex-direction:column;gap:2px;font-size:10px;color:var(--mute);letter-spacing:.1em}
input[type=range]{width:100%;height:34px;accent-color:var(--on)}
.stop{height:46px;padding:0 14px;border-radius:12px;border:0;background:var(--warn);color:#fff;font-weight:700;font-size:13px}
.cfg{width:46px;height:46px;border-radius:12px;border:0;background:var(--panel);color:var(--ink);font-size:20px}
main{flex:1;min-height:0;display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:8px}
@media (orientation:portrait){main{grid-template-columns:repeat(4,minmax(0,1fr));grid-template-rows:repeat(2,minmax(0,1fr))}.lbl{font-size:7px;letter-spacing:.04em}.ch .nm{font-size:10px}.vol{min-width:0;flex:1 1 40px}header{gap:5px}.tone{gap:4px;padding:4px}.tone .n{min-width:52px}.tone .n b{font-size:22px}.tone button{width:38px}.stop{padding:0 8px;font-size:11px}.cfg{width:38px}}
@media (max-height:430px){.ch{gap:2px;padding:6px 4px}.tone button,.stop,.cfg{height:40px}.cfg{width:40px}input[type=range]{height:26px}.tg{height:32px}.ch .nm{min-height:22px;font-size:10px}.knob .v{font-size:12px}}
.sig{flex:0 0 auto;text-align:center;font-size:10px;font-weight:500;letter-spacing:.18em;color:#6e6e73;text-transform:none;padding:1px 0 0}
.ch.master{background:linear-gradient(180deg,#ececf0,#c3c3c8);border-color:#f5f5f7;box-shadow:inset 0 1px 0 #fff,0 0 0 1px #00000040}
.ch.master .nm,.ch.master .num,.ch.master .mv{color:#111}
.mtrack{position:relative;flex:1;min-height:60px;width:100%;touch-action:none;display:flex;justify-content:center;margin:4px 0}
.mtrack:before{content:"";position:absolute;top:8px;bottom:8px;left:50%;width:8px;margin-left:-4px;border-radius:4px;background:#9a9aa0}
.mtrack .fill{position:absolute;bottom:8px;left:50%;width:8px;margin-left:-4px;border-radius:4px;background:#111}
.mtrack .th{position:absolute;left:50%;width:64%;max-width:58px;height:26px;margin-left:calc(-32%);transform:translateY(50%);border-radius:8px;background:linear-gradient(#3a3a3d,#0c0c0e);box-shadow:0 2px 5px #0006}
.mtrack .th:after{content:"";position:absolute;left:18%;right:18%;top:50%;height:2px;margin-top:-1px;background:#d1d1d6;border-radius:1px}
.ch.master .mv{font-size:13px;font-weight:700;min-height:16px}
.ch.master .lbl{color:#444}
.ch{overflow:hidden;background:linear-gradient(180deg,#2a2a2d,#1d1d1f);border-radius:14px;display:flex;flex-direction:column;align-items:center;padding:8px 4px;gap:3px;min-height:0;border:1px solid #38383b;box-shadow:inset 0 1px 0 rgba(255,255,255,.06)}
.ch.on{border-color:#d1d1d699;box-shadow:inset 0 1px 0 rgba(255,255,255,.08),0 0 0 1px #d1d1d633,0 0 18px #d1d1d622}
.ch .nm{font-size:11px;font-weight:700;letter-spacing:.04em;text-align:center;line-height:1.1;min-height:26px;display:flex;align-items:center;color:var(--ink)}
.ch .num{font-size:9px;color:var(--mute)}
.kb{flex:1 1 0;min-height:0;width:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px}
.knob{position:relative;width:min(100%,17vh,76px);aspect-ratio:1;touch-action:none;flex:0 0 auto}
.knob svg{width:100%;height:100%}
.knob .v{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600;pointer-events:none;color:var(--ink)}
.lbl{font-size:8px;color:var(--mute);letter-spacing:.12em}
.tg{width:90%;height:38px;border-radius:9px;border:0;background:#3a3a3d;color:#c7c7cc;font-weight:700;font-size:12px;letter-spacing:.05em;flex:0 0 auto}
.ch.on .tg{background:var(--on);color:#1c1c1e}
.snd{width:100%;border:0;background:none;color:var(--mute);font-size:9px;padding:1px;flex:0 0 auto;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#modal{position:fixed;inset:0;background:#000a;z-index:40;display:none;align-items:center;justify-content:center;padding:16px}
#modal.show{display:flex}
#box{background:var(--panel);border-radius:18px;width:min(520px,100%);max-height:100%;display:flex;flex-direction:column;overflow:hidden}
#box h2{margin:0;padding:14px 16px;font-size:16px;border-bottom:1px solid var(--panel2);display:flex;justify-content:space-between;align-items:center}
#list{overflow:auto;padding:6px}
.row{display:flex;align-items:center;gap:8px;padding:8px;border-radius:10px}
.row.sel{background:var(--panel2)}
.row .t{flex:1;font-size:14px}.row .t small{display:block;color:var(--mute);font-size:11px}
.row button{border:0;border-radius:10px;padding:10px 12px;font-size:13px;font-weight:700}
.row .pv{background:var(--panel2);color:var(--ink)}.row .use{background:var(--acc);color:#1c1c1e}
.x{border:0;background:var(--panel2);color:var(--ink);border-radius:10px;padding:8px 12px;font-size:14px}
#toast{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);background:#000c;color:#fff;padding:10px 16px;border-radius:12px;font-size:13px;z-index:60;display:none;max-width:90vw;text-align:center}

/* ===== tema azul noturno ===== */
:root{--bg:#030c24;--ink:#eaf4ff;--mute:#9db6d6;--on:#9fdcff;--acc:#4fc3ff}
html,body{background:#030c24}
#appbg{position:fixed;inset:0;width:100%;height:100%;z-index:0}
#app{position:relative;z-index:1}
.tone{background:rgba(10,36,76,.62);border:1.5px solid rgba(70,150,235,.7);box-shadow:0 0 14px rgba(30,120,230,.35),inset 0 1px 0 rgba(255,255,255,.12);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);border-radius:16px}
.tone button{background:rgba(35,75,130,.55);border:1px solid rgba(90,160,240,.45);color:#eaf4ff}
.tone .n small{color:#bcd3ee}
.stop{background:linear-gradient(#ff6a5c,#c8231d);box-shadow:0 0 14px rgba(255,70,55,.55),inset 0 1px 0 rgba(255,255,255,.35);border:1px solid rgba(255,150,140,.6);text-shadow:0 1px 2px rgba(0,0,0,.35)}
.cfg{background:rgba(10,36,76,.62);border:1.5px solid rgba(70,150,235,.55);color:#eaf4ff;box-shadow:0 0 10px rgba(30,120,230,.25)}
.ch{background:linear-gradient(180deg,rgba(24,62,118,.55),rgba(7,26,58,.72));border:1.5px solid rgba(60,130,215,.6);border-radius:16px;box-shadow:inset 0 1px 0 rgba(255,255,255,.12),0 0 8px rgba(30,110,220,.18);backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px)}
.ch.on{border-color:#63c8ff;box-shadow:inset 0 1px 0 rgba(255,255,255,.18),0 0 18px rgba(60,170,255,.55)}
.ch .nm{color:#f2f8ff}
.knob .trk{stroke:#12305a}
.knob .val{stroke:#58c9ff;filter:drop-shadow(0 0 3px rgba(80,200,255,.9))}
.knob .ptr{stroke:#a9e4ff}
.knob .v{color:#f2f8ff}
.tg{background:linear-gradient(rgba(34,74,130,.7),rgba(12,36,76,.85));border:1px solid rgba(90,160,240,.5);color:#d6e8ff}
.ch.on .tg{background:linear-gradient(#ffffff,#bfe4ff);color:#08306a;border-color:#fff;box-shadow:0 0 14px rgba(120,205,255,.9)}
.snd{color:#c2d6f0}
.ch.master{background:linear-gradient(180deg,#f0f6ff,#c4d6f0);border-color:#ffffff;box-shadow:inset 0 1px 0 #fff,0 0 20px rgba(150,205,255,.55)}
.ch.master .nm,.ch.master .num,.ch.master .mv{color:#0b1f40}
.ch.master .lbl{color:#27406a}
.mtrack:before{background:#8aa3c8}
.mtrack .fill{background:#0b2a5c;box-shadow:0 0 8px rgba(40,130,255,.7)}
.mtrack .th{background:linear-gradient(#2a4a7c,#06122a);box-shadow:0 2px 8px rgba(0,20,60,.5)}
.mtrack .th:after{background:#bfe4ff}
.sig{color:rgba(205,225,255,.8);font-style:italic;letter-spacing:.22em;text-shadow:0 1px 6px #00112a}
#box{background:#0a2146;border:1px solid rgba(70,150,235,.6)}
#box h2{border-color:rgba(70,150,235,.35)}
.row.sel{background:rgba(50,110,190,.35)}
.row .pv{background:rgba(50,110,190,.45);color:#eaf4ff}.row .use{background:#8fd6ff;color:#06204a}
.x{background:rgba(50,110,190,.45);color:#eaf4ff}
</style>
</head>

var loopCache={};
function loopBuf(id,b){

    for(var i=0;i<F;i++){var t=i/F,wi=Math.sin(t*Math.PI/2),wo=Math.cos(t*Math.PI/2);y[i]=x[i]*wi+x[n+i]*wo}}
